# =========================================================
# 星屑 · Hoshikuzu 配置文件模板
#
# 使用方法：
#   cp config.example.yaml config.yaml
#   然后编辑 config.yaml，至少修改标注 [必改] 的项
#
# 修改后需要重启服务生效。
# =========================================================


server:
  # 监听地址。0.0.0.0 表示所有网卡
  host: "0.0.0.0"

  # 监听端口
  port: 2525

  # 生产环境设为 true，关闭 Gin 的调试输出
  release_mode: true

  # -----------------------------------------------------
  # 可信反向代理列表（IP 或 CIDR）
  #
  # 安全语义：只有当 TCP 连接来源（RemoteAddr）命中这里时，
  # 才会解析 X-Forwarded-For / CF-Connecting-IP / X-Real-IP。
  # 否则这些头一律忽略，直接用 TCP 来源 IP。
  #
  # 这防止攻击者伪造 XFF 绕过 IP 配额 / 白名单。
  #
  # 部署方式决定怎么填：
  #   直接暴露给用户      → 留空数组 []（所有转发头被忽略）
  #   Nginx / Caddy 本机  → ["127.0.0.1", "::1"]
  #   Docker 桥接网络     → ["172.17.0.0/16", ...]
  #   Cloudflare 直连     → 填 Cloudflare 官方 IP 段
  # -----------------------------------------------------
  trusted_proxies:
    - "127.0.0.1"
    - "::1"
    # - "172.17.0.0/16"

  # HTTP 读写超时（秒）。0 = 无超时（不推荐）
  # ReadTimeout 覆盖请求体读取（含大文件上传）
  # WriteTimeout 覆盖响应写入（含大文件下载 / ZIP 打包）
  # 需要大于最大上传 / 下载所需时间
  read_timeout_sec: 600
  write_timeout_sec: 600


storage:
  # SQLite 数据库 + ZIP 临时文件目录
  data_dir: "./data"

  # 图片文件存储目录
  storage_dir: "./storage"


auth:
  # -----------------------------------------------------
  # [必改] 管理员密钥
  #
  # 管理员密钥不受任何配额限制，可以上传 / 删除图片。
  #
  # 建议用长随机串，例如：
  #   openssl rand -base64 24
  # -----------------------------------------------------
  admin_token: "CHANGE_ME_ADMIN_TOKEN"

  # -----------------------------------------------------
  # [建议改] 访客密钥
  #
  # 访客密钥公开在 /api/public-config，任何人都能看到。
  # 它只用于标识"我是一个正常访客"，不做权限控制。
  #
  # 建议不要用 6 位纯数字，避免和临时密钥格式冲突
  # （临时密钥是 6 位数字，格式冲突会被计入失败次数）。
  # -----------------------------------------------------
  guest_token: "CHANGE_ME_GUEST_TOKEN"

  # -----------------------------------------------------
  # [必改] 图片 URL 签名密钥
  #
  # /images/... 的所有访问都必须带有效 HMAC 签名。
  # 签名由 /api/random 和 /api/images/:id/download 签发，
  # 有效期 1 小时。
  #
  # 生成方式：
  #   openssl rand -hex 32
  #
  # 留空会导致进程重启后所有已签发的图片 URL 立即失效
  # （表现为用户看到"图片突然都打不开"）。
  #
  # 首次启动不配置也行（会自动生成随机密钥），
  # 但生产环境强烈建议配置一个固定值。
  # -----------------------------------------------------
  sign_key: ""

  # -----------------------------------------------------
  # 白名单（IP 维度 + Origin 维度）
  #
  # 两个都空 = 不激活：admin_token 从任何地方都直接是 admin。
  #
  # 至少一个非空 = 激活：
  #   - admin_token 只在白名单内有效
  #   - 白名单外的 admin_token 降级为 guest
  #   - 白名单外的管理员需要生成临时密钥
  #
  # 仅作为公开 API 使用时，建议留空。
  # 后台管理入口建议配合 Nginx basic auth 或 Cloudflare Access。
  # -----------------------------------------------------
  allowed_ips: []
    # - "127.0.0.1"
    # - "::1"
    # - "203.0.113.42"
  # - "2001:db8::/32"

  allowed_origins: []
    # - "https://random.example.com"
  # - "http://localhost:2525"

  # any = 任意一个已配置维度通过即通过
  # all = 所有已配置维度都通过才通过
  guard_mode: "any"


# =========================================================
# 访客配额（按天重置，按客户端 IP 独立计数）
#
# 0 表示"无限制"。
# 管理员密钥不受任何配额限制。
# =========================================================
limits:
  guest:
    # /api/random?mode=original 的每日调用次数
    api_original_per_day: 50

    # /api/random（默认缩略图模式）的每日调用次数
    # 0 = 无限制（缩略图本来就是给展示用的）
    api_thumb_per_day: 0

    # /api/images/:id/download?mode=original 的每日下载次数
    download_original_per_day: 10

    # /api/images/:id/download（默认缩略图模式）的每日下载次数
    # 注意：小图（< 200KB）也按"压缩图"配额计费，不占原图配额
    download_thumb_per_day: 100


permissions:
  guest:
    # 是否允许访客上传图片
    upload: false

    # 是否允许访客删除图片
    delete: false


upload:
  # 单张文件大小上限（MB）
  max_file_mb: 50

  # 单批最多文件数
  max_batch_files: 100

  # 单批总大小上限（MB）
  # 也是整个 HTTP 请求体的硬上限（+1MB 缓冲）
  max_batch_size_mb: 500


mobile:
  # 宽度阈值：
  #   宽度 <= 此值 或 竖图（高 >= 宽） → 归为 mobile
  #   其余 → desktop
  width_threshold: 768